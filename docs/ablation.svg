<svg xmlns="http://www.w3.org/2000/svg" width="760" height="348" viewBox="0 0 760 348" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.grid{stroke:#e4e3df}.s1{fill:#2a78d6}.ref{fill:#a3a29c}@media (prefers-color-scheme:dark){.bg{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.grid{stroke:#3a3936}.s1{fill:#3987e5}.ref{fill:#77766f}}</style>
<rect class="bg" width="760" height="348" rx="8"/>
<text class="t1" x="24" y="30" font-size="16" font-weight="600">Possession recovery (spellF1) on held-out matches, with simulated tracking noise</text>
<text class="t2" x="24" y="50" font-size="12.5">Metrica sample games 1–2, leave-one-game-out, official scorer. Higher is better.</text>
