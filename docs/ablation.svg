<path class="s1" d="M270,113.0 H500.0 a4,4 0 0 1 4,4 V131.0 a4,4 0 0 1 -4,4 H270 Z"/>
<text class="t1" x="512.0" y="128.5" font-size="13" font-weight="400">0.468</text>
<text class="t1" x="258" y="168.5" font-size="13" text-anchor="end">+ controlled-touch rule</text>
