<text class="t2" x="370.0" y="322" font-size="11.5" text-anchor="middle">0.2</text>
<line class="grid" x1="470.0" x2="470.0" y1="60" y2="304" stroke-width="1"/>
<text class="t2" x="470.0" y="322" font-size="11.5" text-anchor="middle">0.4</text>
<line class="grid" x1="570.0" x2="570.0" y1="60" y2="304" stroke-width="1"/>
<text class="t2" x="570.0" y="322" font-size="11.5" text-anchor="middle">0.6</text>
<line class="grid" x1="670.0" x2="670.0" y1="60" y2="304" stroke-width="1"/>
